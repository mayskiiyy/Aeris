name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Aeris.sln -c Release --nologo -warnaserror
      - name: Test
        run: dotnet test Aeris.sln -c Release --nologo --no-build

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build CLI and desktop
        run: |
          dotnet build src/Aeris.Cli -c Release --nologo -warnaserror
          dotnet build src/Aeris.Desktop -c Release --nologo -warnaserror
      - name: Package
        run: bash build-linux.sh '${{ matrix.rid }}'
      - name: Check packaged CLI on isolated files
        shell: python
        run: |
          import json, os, pathlib, subprocess, tarfile, tempfile
          with tempfile.TemporaryDirectory(prefix='aeris-ci-') as work:
              root = pathlib.Path(work)
              archive = next(pathlib.Path('artifacts').glob('aeris-cli-*.tar.gz'))
              with tarfile.open(archive) as package:
                  package.extractall(root / 'app', filter='data')
              cli = str(root / 'app' / 'aeris-cli')
              env = dict(os.environ, HOME=str(root / 'home'), XDG_DATA_HOME=str(root / 'data'), XDG_CACHE_HOME=str(root / 'cache'))
              pathlib.Path(env['HOME']).mkdir()
              files = root / 'files'
              files.mkdir()
              (files / 'A.txt').write_text('same bytes')
              (files / 'a.txt').write_text('same bytes')
              os.link(files / 'A.txt', files / 'hardlink.txt')
              os.symlink('/etc', files / 'outside')
              result = subprocess.run([cli, 'duplicates', str(files), '--json'], env=env, capture_output=True, text=True)
              assert result.returncode == 1, result.stderr
              groups = json.loads(result.stdout)['groups']
              assert len(groups) == 1 and len(groups[0]['files']) == 2, groups
              assert subprocess.run([cli, 'clean', '--scheduled', '--categories', 'gradle-caches', '--dry-run'], env=env).returncode == 2
              assert subprocess.run([cli, 'categories', '--json'], env=env, stdout=subprocess.DEVNULL).returncode == 0
