ShortDescription: Shows where your disk space went and cleans old cache and temp files. Local only, no telemetry.
Description: |-
  Aeris is a small Windows app for disk cleanup. It removes old files from the Windows and user Temp folders and from the caches of installed browsers, lists the largest files in a folder, shows a folder map and finds duplicate files by SHA-256. Personal files only go to the Recycle Bin. Aeris makes no network requests and collects no telemetry.
